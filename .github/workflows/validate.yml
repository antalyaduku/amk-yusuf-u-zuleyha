name: Veri bütünlüğünü doğrula

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TSV veri bütünlüğü
        run: python3 scripts/validate_data.py
      - name: JSONL çıktısını üret
        run: python3 scripts/build_jsonl.py
